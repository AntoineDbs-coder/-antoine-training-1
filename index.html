const DB = (()=>{

const DB_NAME="antoine-training-pro"; const DB_VERSION=1;
let dbPromise;
function db(){
 if(dbPromise)return dbPromise;
 dbPromise=new Promise((resolve,reject)=>{
  const r=indexedDB.open(DB_NAME,DB_VERSION);
  r.onupgradeneeded=()=>{const d=r.result;
   if(!d.objectStoreNames.contains("kv"))d.createObjectStore("kv");
   if(!d.objectStoreNames.contains("sessions"))d.createObjectStore("sessions",{keyPath:"id",autoIncrement:true});
   if(!d.objectStoreNames.contains("weighIns"))d.createObjectStore("weighIns",{keyPath:"id",autoIncrement:true});
   if(!d.objectStoreNames.contains("weekly"))d.createObjectStore("weekly",{keyPath:"id",autoIncrement:true});
  };
  r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
 });return dbPromise;
}
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function getKV(k,def=null){const d=await db(),tx=d.transaction("kv","readonly");const v=await req(tx.objectStore("kv").get(k));return v??def}
async function setKV(k,v){const d=await db(),tx=d.transaction("kv","readwrite");await req(tx.objectStore("kv").put(v,k))}
async function add(store,v){const d=await db(),tx=d.transaction(store,"readwrite");return req(tx.objectStore(store).add(v))}
async function put(store,v){const d=await db(),tx=d.transaction(store,"readwrite");return req(tx.objectStore(store).put(v))}
async function all(store){const d=await db(),tx=d.transaction(store,"readonly");return req(tx.objectStore(store).getAll())}
async function remove(store,id){const d=await db(),tx=d.transaction(store,"readwrite");return req(tx.objectStore(store).delete(id))}
async function clearAll(){
 const d=await db(); for(const s of ["kv","sessions","weighIns","weekly"]){const tx=d.transaction(s,"readwrite");await req(tx.objectStore(s).clear())}
}
async function exportAll(){return {kv:{profile:await getKV("profile"),active:await getKV("active"),prefs:await getKV("prefs")},sessions:await all("sessions"),weighIns:await all("weighIns"),weekly:await all("weekly")}}
async function importAll(x){
 await clearAll(); if(x.kv?.profile)await setKV("profile",x.kv.profile);if(x.kv?.prefs)await setKV("prefs",x.kv.prefs);if(x.kv?.active)await setKV("active",x.kv.active);
 for(const v of x.sessions||[]){delete v.id;await add("sessions",v)}for(const v of x.weighIns||[]){delete v.id;await add("weighIns",v)}for(const v of x.weekly||[]){delete v.id;await add("weekly",v)}
}

return {getKV,setKV,add,put,all,remove,clearAll,exportAll,importAll};
})();


const day=86400000;
function phase(now=new Date()){
 if(now<START_DATE)return {key:"prep",label:"Préparation",target:0,rir:"3–4",normal:["A","B","C"]};
 if(now<TWO_DAY_DATE)return {key:"three",label:"3 séances / semaine",target:3,rir:weekNumber(now)<=2?"3–4":weekNumber(now)<=6?"2–3":"1–2",normal:["A","B","C"]};
 return {key:"two",label:"2 séances / semaine",target:2,rir:"1–3",normal:["A","B"]};
}
function weekNumber(now=new Date()){return Math.max(1,Math.floor((now-START_DATE)/(7*day))+1)}
function weekStart(d=new Date()){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function thisWeek(sessionsData){const start=weekStart();return sessionsData.filter(s=>new Date(s.finishedAt||s.startedAt)>=start)}
function nextSession(sessionsData,now=new Date()){
 const p=phase(now),keys=p.normal,done=sessionsData.filter(s=>keys.includes(s.sessionKey)).sort((a,b)=>new Date(a.finishedAt)-new Date(b.finishedAt));
 if(!done.length)return keys[0];const last=done.at(-1)?.sessionKey;return keys[(keys.indexOf(last)+1)%keys.length];
}
function lastVariantResult(sessionData,exerciseId,variantKey="base"){
 for(let i=sessionData.length-1;i>=0;i--){const e=sessionData[i].exercises?.find(x=>x.exerciseId===exerciseId && (x.variantKey||"base")===variantKey);if(e)return e}return null;
}
function suggestLoad(sessionData,exerciseId,variantKey="base"){
 const ex=exercises[exerciseId],last=lastVariantResult(sessionData,exerciseId,variantKey);if(!last)return {kind:"discover",label:"Trouve ta charge",load:null};
 const sets=(last.sets||[]).filter(x=>x.done);if(!sets.length)return {kind:"keep",label:"Garde la dernière charge",load:Number(last.workLoad||0)};
 const load=Number(sets[0].load||last.workLoad||0);if(ex.unit==="sec")return {kind:"keep",label:"Garde une durée propre",load};
 const reps=sets.map(s=>Number(s.reps||0)), rirs=sets.map(s=>Number(s.rir ?? 99)); const inc=ex.inc||2.5;
 if(reps.every(r=>r>=ex.max)&&rirs.every(r=>r>=1))return {kind:"up",label:`+${inc} kg proposé`,load:load+inc};
 if(reps.filter(r=>r<ex.min).length>=2 || rirs.filter(r=>r===0).length>=2)return {kind:"down",label:`-${inc} kg proposé`,load:Math.max(0,load-inc)};
 return {kind:"keep",label:"Même charge",load};
}
function warmup(ex,load){
 load=Number(load||0);if(!load||ex.unit==="sec"||ex.warm==="none")return [];
 const round=x=>Math.max(0,Math.round(x/2.5)*2.5);
 if(load<20)return [{load:round(load*.6),reps:6}];
 if(ex.warm==="primary")return [{load:round(load*.4),reps:10},{load:round(load*.6),reps:6},{load:round(load*.8),reps:3}];
 if(ex.warm==="secondary")return [{load:round(load*.55),reps:7},{load:round(load*.78),reps:3}];
 return [{load:round(load*.55),reps:6}];
}
function weeklyLossRate(weighIns){
 const a=[...weighIns].filter(x=>x.weight).sort((x,y)=>new Date(x.date)-new Date(y.date));if(a.length<2)return null;
 const last=a.at(-1),prev=a.at(-2),days=(new Date(last.date)-new Date(prev.date))/day;if(days<4)return null;
 return ((prev.weight-last.weight)/prev.weight)*(7/days)*100;
}
function weightPlateau(weighIns){
 const a=[...weighIns].filter(x=>x.weight).sort((x,y)=>new Date(x.date)-new Date(y.date)).slice(-4);if(a.length<4)return false;
 const vals=a.map(x=>x.weight);return Math.max(...vals)-Math.min(...vals)<0.5;
}
function recommendations({sessionsData,weighIns,weekly,now=new Date()}){
 const out=[],p=phase(now),wk=thisWeek(sessionsData); const latestW=weighIns.sort((a,b)=>new Date(a.date)-new Date(b.date)).at(-1);

 return out.sort((a,b)=>b.priority-a.priority).slice(0,5);
}

function daysToStart(){return Math.max(0,Math.ceil((START_DATE-new Date())/86400000))}
function streak(){
 const completedWeeks=new Map();S.sessions.forEach(s=>{const ws=weekStart(new Date(s.finishedAt||s.startedAt)).toISOString().slice(0,10);completedWeeks.set(ws,(completedWeeks.get(ws)||0)+1)});

}

function workoutBlock(we,ei){
 const ex=exercises[we.exerciseId],sg=suggestLoad(S.sessions,we.exerciseId,we.variantKey),wu=warmup(ex,we.sets[0]?.load||we.workLoad);
 const unit=ex.unit==="sec";

 <div class="setlabels"><span></span><span>${unit?"—":"kg"}</span><span>${unit?"sec":"reps"}</span><span>RIR</span><span></span></div>
 ${we.sets.map((set,si)=>`<div class="setrow"><span class="setnum">${si+1}</span>
 <input ${unit?"disabled":""} inputmode="decimal" value="${unit?"":set.load}" placeholder="${unit?"—":"kg"}" onchange="window.setVal(${ei},${si},'load',this.value)">

 <input inputmode="numeric" value="${set.rir}" placeholder="${w.targetRIR.split("–")[0]}" onchange="window.setVal(${ei},${si},'rir',this.value)">
 <button class="donebtn ${set.done?"done":""}" onclick="window.toggleSet(${ei},${si},this)">${set.done?"✓":"○"}</button></div>`).join("")}</div>`;
}
window.setVal=async(ei,si,k,v)=>{S.active.exercises[ei].sets[si][k]=v;await DB.setKV("active",S.active)}
window.toggleSet=async(ei,si,b)=>{
 const we=S.active.exercises[ei],st=we.sets[si];st.done=!st.done;b.classList.toggle("done",st.done);b.textContent=st.done?"✓":"○";
 if(st.done){const n=we.sets[si+1];if(n&&!n.load)n.load=st.load;if(S.prefs.autoRest)startRest(exercises[we.exerciseId].rest)}await DB.setKV("active",S.active);
}
window.swapExercise=ei=>{
 const we=S.active.exercises[ei],e=exercises[we.exerciseId];showSheet(`<h2>Machine prise ?</h2><p class="small muted">Choisis une alternative pour cette séance uniquement. Les charges sont suivies séparément : elles ne sont pas comparables entre machines.</p>
 <div class="alt-choice"><div><b>${e.name}</b><small>Revenir à l’exercice prévu</small></div><button class="btn alt" onclick="window.chooseAlt(${ei},'base','${e.name.replaceAll("'","")}')">Choisir</button></div>
 ${e.alternatives.map(a=>`<div class="alt-choice"><div><b>${a.name}</b><small>${a.note}</small></div><button class="btn" onclick="window.chooseAlt(${ei},'${a.key}','${a.name.replaceAll("'","")}')">Choisir</button></div>`).join("")}`);
}
window.chooseAlt=async(ei,key,name)=>{
 const we=S.active.exercises[ei],sg=suggestLoad(S.sessions,we.exerciseId,key);we.variantKey=key;we.variantName=name;we.workLoad=sg.load||"";we.sets.forEach(x=>{x.load=sg.load||"";x.reps="";x.rir="";x.done=false});await DB.setKV("active",S.active);showWorkout();
}
window.finishWorkout=async()=>{
 const w=S.active;w.finishedAt=new Date().toISOString();w.completedSets=w.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);w.id=await DB.add("sessions",w);S.sessions.push(w);S.active=null;await DB.setKV("active",null);stopRest();closeSheet();celebrate();render();toast("Séance enregistrée ✓");
}
window.saveAndClose=()=>closeSheet();
window.cancelWorkout=async()=>{if(confirm("Annuler cette séance ?")){S.active=null;await DB.setKV("active",null);stopRest();closeSheet()}}
function startRest(sec){clearInterval(restTimer);restLeft=sec;$("#restFloat").classList.add("show");tick();restTimer=setInterval(()=>{restLeft--;tick();if(restLeft<=0){stopRest();beep()}},1000)}
function tick(){const m=Math.floor(restLeft/60),s=restLeft%60;$("#restValue").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function stopRest(){clearInterval(restTimer);$("#restFloat").classList.remove("show")}
function beep(){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=640;g.gain.value=.06;o.start();o.stop(c.currentTime+.18)}catch{}}
function celebrate(){const box=document.createElement("div");box.className="confetti";const cols=["#EF6A57","#67C8B2","#F2B544","#B9A7EF"];for(let i=0;i<28;i++){const e=document.createElement("i");e.style.left=Math.random()*100+"%";e.style.background=cols[i%4];e.style.animationDelay=Math.random()*.4+"s";box.append(e)}document.body.append(box);setTimeout(()=>box.remove(),2400)}
window.logWeight=()=>{
 const last=S.weighIns.at(-1)?.weight||latestWeight();showSheet(`<h2>Poids de la semaine</h2><p class="small muted">Une mesure suffit. Idéalement : conditions similaires d’une semaine à l’autre.</p><div class="field"><label>Poids en kg</label><input id="weightInput" inputmode="decimal" value="${last}"></div><button class="btn full" style="margin-top:12px" onclick="window.saveWeight()">Enregistrer</button>`);
}
window.saveWeight=async()=>{
 const weight=Number($("#weightInput").value.replace?.(",",".")||$("#weightInput").value);if(!weight||weight<40||weight>250)return alert("Vérifie le poids saisi.");
 const x={date:new Date().toISOString(),weight};x.id=await DB.add("weighIns",x);S.weighIns.push(x);closeSheet();render();toast("Poids enregistré");
}
window.showWeightHistory=()=>{
 showSheet(`<h2>Évolution du poids</h2><div class="card chart-card"><canvas id="sheetWeightChart"></canvas></div><div class="card">${[...S.weighIns].reverse().map(x=>`<div class="weight-entry"><span>${fmt(x.date,{day:"numeric",month:"long"})}</span><b>${x.weight.toFixed(1)} kg</b><button class="btn alt" onclick="window.deleteWeight(${x.id})">×</button></div>`).join("")||'<span class="muted small">Aucune mesure.</span>'}</div>`);
 setTimeout(()=>lineChart($("#sheetWeightChart"),S.weighIns.map(x=>({date:x.date,value:x.weight})),{target:S.profile.targetWeight,suffix:" kg"}),0);
}
window.deleteWeight=async id=>{await DB.remove("weighIns",id);S.weighIns=S.weighIns.filter(x=>x.id!==id);window.showWeightHistory();render()}
window.weeklyCheck=()=>{
 const l=S.weekly.at(-1)||{};showSheet(`<h2>Bilan hebdomadaire</h2><p class="small muted">Ces données servent au coach pour adapter la charge de travail, pas à te noter.</p><div class="form-grid">
 <div class="field"><label>Sommeil /10</label><input id="sleep" type="number" min="0" max="10" value="${l.sleep??7}"></div><div class="field"><label>Fatigue /10</label><input id="fatigue" type="number" min="0" max="10" value="${l.fatigue??4}"></div>
 <div class="field"><label>Pas / jour moyens</label><input id="steps" inputmode="numeric" value="${l.steps||S.profile.stepsGoal}"></div><div class="field"><label>Cardio facile (min)</label><input id="cardio" inputmode="numeric" value="${l.cardio||0}"></div></div>
 <button class="btn full" style="margin-top:12px" onclick="window.saveWeekly()">Enregistrer</button>`);
}
window.saveWeekly=async()=>{
 const x={date:new Date().toISOString(),sleep:Number($("#sleep").value),fatigue:Number($("#fatigue").value),steps:Number($("#steps").value)||0,cardio:Number($("#cardio").value)||0};x.id=await DB.add("weekly",x);S.weekly.push(x);closeSheet();render();toast("Bilan enregistré");
}
function settingsSheet(){
 showSheet(`<h2>Réglages</h2><div class="form-grid"><div class="field"><label>Poids initial</label><input id="sw" inputmode="decimal" value="${S.profile.startWeight}"></div><div class="field"><label>Objectif</label><input id="tw" inputmode="decimal" value="${S.profile.targetWeight}"></div><div class="field"><label>Objectif pas</label><input id="sg" inputmode="numeric" value="${S.profile.stepsGoal}"></div></div>
 <div class="card" style="margin-top:11px"><div class="row"><div><b>Chrono automatique</b><div class="small muted">Après chaque série validée</div></div><input id="autoRest" type="checkbox" ${S.prefs.autoRest?"checked":""}></div></div>
 <button class="btn full" onclick="window.saveSettings()">Enregistrer</button>
 <div class="section-head"><h2>Données</h2></div><button class="btn alt full" onclick="window.exportData()">Exporter une sauvegarde</button><label class="btn alt full" style="display:block;text-align:center;margin-top:8px">Importer une sauvegarde<input type="file" accept=".json" style="display:none" onchange="window.importData(this.files[0])"></label>
 <div class="section-head"><h2>Installation</h2></div><div class="install">Sur iPhone : ouvre l’URL avec <b>Safari</b> → Partager → <b>Sur l’écran d’accueil</b>. Version ${APP_VERSION}.</div>`);
}
window.saveSettings=async()=>{
 S.profile={startWeight:Number($("#sw").value)||105,targetWeight:Number($("#tw").value)||80,stepsGoal:Number($("#sg").value)||8000};S.prefs.autoRest=$("#autoRest").checked;await DB.setKV("profile",S.profile);await DB.setKV("prefs",S.prefs);closeSheet();render();toast("Réglages enregistrés");
}
window.exportData=async()=>{const x=await DB.exportAll();const blob=new Blob([JSON.stringify(x,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`antoine-training-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
window.importData=async f=>{if(!f)return;try{await DB.importAll(JSON.parse(await f.text()));closeSheet();await init();toast("Sauvegarde restaurée")}catch(e){alert("Sauvegarde invalide")}}
window.goCoach=()=>nav("coachScreen");window.goWorkouts=()=>nav("workoutsScreen");
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
init();

</script>
</body></html>
