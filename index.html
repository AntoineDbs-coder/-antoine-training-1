<body><div id="app"><header class="top"><div class="brand"><span class="mark">AT</span><div><b>Antoine Training</b><small id="phaseLabel">Rotation libre</small></div></div><button class="gear" type="button" data-action="settings">⚙️</button></header><main>
<section id="home" class="screen active"></section><section id="sessions" class="screen"></section><section id="coach" class="screen"></section><section id="progress" class="screen"></section><section id="exercises" class="screen"></section>
</main><nav class="tabbar"><button type="button" data-nav="home" class="active"><span>⌂</span>Accueil</button><button type="button" data-nav="sessions"><span>◉</span>Séances</button><button type="button" data-nav="coach"><span>✦</span>Repères</button><button type="button" data-nav="progress"><span>↗</span>Progrès</button><button type="button" data-nav="exercises"><span>▦</span>Exercices</button></nav></div>

function clone(o){return JSON.parse(JSON.stringify(o))}function load(){try{const x=JSON.parse(localStorage.getItem('antoineTrainingV3'));return Object.assign(clone(defaults),x||{},{profile:Object.assign({},defaults.profile,x&&x.profile||{}),prefs:Object.assign({},defaults.prefs,x&&x.prefs||{})})}catch(e){return clone(defaults)}}function save(){try{localStorage.setItem('antoineTrainingV3',JSON.stringify(S))}catch(e){}}
function phase(){const d=new Date();if(d<START)return{key:'prep',label:'Préparation',target:0,rir:'3–4',keys:['A','B','C']};if(d<TWO){const w=Math.max(1,Math.floor((d-START)/(7*86400000))+1);return{key:'three',label:'3 séances / semaine',target:3,rir:w<=2?'3–4':w<=6?'2–3':'1–2',keys:['A','B','C']}}return{key:'two',label:'2 séances / semaine',target:2,rir:'1–3',keys:['A','B']}}
function weekStart(d){const x=new Date(d||new Date());x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}function thisWeek(){const s=weekStart();return S.history.filter(h=>new Date(h.end||h.start)>=s)}function nextKey(){const p=phase(),list=p.keys,done=S.history.filter(h=>list.includes(h.key));if(!done.length)return list[0];const last=done[done.length-1].key;return list[(list.indexOf(last)+1)%list.length]}
function latestWeight(){return S.weights.length?Number(S.weights[S.weights.length-1].weight):S.profile.startWeight}function fmtDate(v,opt){return new Intl.DateTimeFormat('fr-FR',opt||{day:'numeric',month:'short'}).format(new Date(v))}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function lastExercise(id){for(let i=S.history.length-1;i>=0;i--){const e=(S.history[i].exercises||[]).find(x=>x.id===id);if(e)return e}return null}function loadSuggestion(id){const e=E[id],last=lastExercise(id);if(!last)return{load:'',label:'Calibrer la charge'};const ds=(last.sets||[]).filter(x=>x.done);if(!ds.length)return{load:last.load||'',label:'Reprendre la dernière charge'};if(e.unit==='sec')return{load:'',label:'Garder une tenue propre'};const load=Number(ds[0].load||last.load||0),reps=ds.map(x=>Number(x.reps||0)),rirs=ds.map(x=>Number(x.rir||99));if(reps.every(r=>r>=e.max)&&rirs.every(r=>r>=1))return{load:load+e.inc,label:'Augmentation proposée'};if(reps.filter(r=>r<e.min).length>=2||rirs.filter(r=>r===0).length>=2)return{load:Math.max(0,load-e.inc),label:'Réduction proposée'};return{load:load,label:'Même charge proposée'}}
function warm(id,load){const e=E[id];if(!e.warm||e.unit==='sec')return[];const patterns=e.warm===3?[[.4,10,'Très léger'],[.6,6,'Léger'],[.8,3,'Proche de la charge de travail']]:e.warm===2?[[.55,7,'Léger'],[.78,3,'Proche de la charge de travail']]:[[.55,6,'Léger']];const L=Number(load||0),round=x=>Math.max(0,Math.round(x/2.5)*2.5);return patterns.map(([p,r,label])=>({l:L?round(L*p):null,r,label}))}
function warmText(x){return x.l!=null?`${x.l} kg × ${x.r}`:`${x.label} × ${x.r}`}
function latestSteps(){if(S.health&&S.health.steps&&S.health.steps.length)return Number(S.health.steps[S.health.steps.length-1].steps);const w=S.weekly[S.weekly.length-1];return w&&w.steps?Number(w.steps):null}
function durationMin(h){if(!h||!h.start||!h.end)return null;return Math.max(1,Math.round((new Date(h.end)-new Date(h.start))/60000))}
function videoUrl(id){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(E[id].n+' technique musculation')}

function altReason(e){return e.altNote||'Alternative sélectionnée pour conserver le même schéma de mouvement et/ou le même muscle principal.'}
function bestHistorical(id){let best=0;S.history.forEach(h=>{const x=(h.exercises||[]).find(z=>z.id===id);if(!x)return;(x.sets||[]).filter(s=>s.done).forEach(s=>{const v=E[id]?.unit==='sec'?Number(s.reps||0):Number(s.load||0);if(v>best)best=v})});return best}
function countRecords(a){let n=0;(a.exercises||[]).forEach(x=>{const prev=bestHistorical(x.id);const ds=(x.sets||[]).filter(s=>s.done);if(!ds.length)return;const cur=E[x.id]?.unit==='sec'?Math.max(...ds.map(s=>Number(s.reps||0))):Math.max(...ds.map(s=>Number(s.load||0)));if(prev>0&&cur>prev)n++});return n}
function moveExercise(i,dir){const a=S.active;if(!a)return;const j=i+dir;if(j<0||j>=a.exercises.length)return;const current=a.exercises[a.index];[a.exercises[i],a.exercises[j]]=[a.exercises[j],a.exercises[i]];a.index=a.exercises.indexOf(current);save();workoutList()}

function migrate(){S.health=S.health||{steps:[],lastImport:null};S.health.steps=S.health.steps||[];S.history=S.history||[];S.weights=S.weights||[];S.weekly=S.weekly||[];S.history.forEach(h=>{h.generalWarmup=h.generalWarmup||{minutes:null,done:false};h.cardio=h.cardio||{minutes:0,type:'',rpe:null,done:false}});if(S.active){S.active.stage=S.active.stage||'lifting';S.active.generalWarmup=S.active.generalWarmup||{minutes:5,done:false};S.active.cardio=S.active.cardio||{minutes:10,type:'Vélo ou marche inclinée',rpe:3,done:false};S.active.exercises=(S.active.exercises||[]).map(x=>Object.assign({warmDone:[]},x))}S.version='5.0';save()}
function importHealthParams(){const q=new URLSearchParams(location.search),wRaw=q.get('healthWeight'),sRaw=q.get('healthSteps'),source=q.get('healthSource')||'Apple Santé';let changed=false;const date=new Date().toISOString();if(wRaw!=null){const w=Number(String(wRaw).replace(',','.'));if(w>=40&&w<=250){const last=S.weights[S.weights.length-1];if(!last||Math.abs(Number(last.weight)-w)>.01||(new Date()-new Date(last.date))>3600000){S.weights.push({date,weight:w,source});changed=true}}}if(sRaw!=null){const steps=Math.round(Number(sRaw));if(steps>=0&&steps<100000){S.health.steps.push({date,steps,source});S.health.steps=S.health.steps.slice(-120);changed=true}}if(changed){S.health.lastImport={date,source};save()}if(wRaw!=null||sRaw!=null){history.replaceState(null,'',location.pathname+location.hash)}return changed}

function recoveryLabel(x){if(x.sleep<=4||x.fatigue>=8)return'Basse';if(x.sleep<=6||x.fatigue>=6)return'Moyenne';return'Bonne'}function coachTips(){const p=phase(),out=[],lastWeight=S.weights[S.weights.length-1],lastW=S.weekly[S.weekly.length-1],wk=thisWeek();if(!lastWeight||(new Date()-new Date(lastWeight.date))/86400000>=7)out.push({t:'Poids hebdomadaire à renseigner',d:'Une mesure par semaine, dans des conditions similaires, suffit pour suivre la tendance.',e:'Modéré'});if(lastW&&(lastW.sleep<=4||lastW.fatigue>=8))out.push({t:'Récupération basse',d:'Privilégie une séance Express ou garde 1 à 2 répétitions supplémentaires en réserve.',e:'Coach'});if(p.target&&wk.length<p.target)out.push({t:`${p.target-wk.length} séance${p.target-wk.length>1?'s':''} à placer`,d:'La régularité compte plus que la perfection. Si nécessaire, utilise le format 30 minutes.',e:'Fort'});if(p.key!=='prep'&&(!lastW||lastW.cardio<60))out.push({t:'Construire progressivement le cardio',d:'Les 10–15 minutes faciles proposées après la musculation sont un début ; complète si possible avec marche rapide ou vélo facile.',e:'Fort'});out.push({t:'Ne complexifie pas le programme',d:'La double progression, le RIR et la régularité suffisent pour ta reprise. Pas besoin de techniques avancées.',e:'Fort'});return out}

function drawLine(canvas,rows,target,suffix){if(!canvas)return;const r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=r.width*d;canvas.height=210*d;const c=canvas.getContext('2d');c.setTransform(d,0,0,d,0,0);const w=r.width,h=210,p={l:38,r:14,t:20,b:28};c.clearRect(0,0,w,h);if(rows.length<2){c.fillStyle='#718089';c.font='12px -apple-system';c.fillText('Deux mesures minimum pour afficher une courbe.',15,38);return}const vals=rows.map(x=>Number(x.v));let mn=Math.min(...vals),mx=Math.max(...vals),gap=Math.max(1,(mx-mn)*.35);mn-=gap;mx+=gap;const X=i=>p.l+i*((w-p.l-p.r)/(rows.length-1)),Y=v=>p.t+(mx-v)/(mx-mn)*(h-p.t-p.b);c.strokeStyle='#DCE3E5';c.beginPath();c.moveTo(p.l,p.t);c.lineTo(p.l,h-p.b);c.lineTo(w-p.r,h-p.b);c.stroke();c.beginPath();rows.forEach((x,i)=>i?c.lineTo(X(i),Y(x.v)):c.moveTo(X(i),Y(x.v)));c.strokeStyle='#0A4B6C';c.lineWidth=3;c.stroke();rows.forEach((x,i)=>{c.beginPath();c.arc(X(i),Y(x.v),4,0,Math.PI*2);c.fillStyle='#F26755';c.fill()});c.fillStyle='#718089';c.font='10px -apple-system';c.fillText(`${mx.toFixed(0)}${suffix||''}`,3,p.t+3);c.fillText(`${mn.toFixed(0)}${suffix||''}`,3,h-p.b);if(target!=null){c.fillStyle='#F26755';const t=`objectif ${target}${suffix||''}`;c.fillText(t,w-p.r-c.measureText(t).width,p.t+2)}}function drawWeight(){drawLine(document.getElementById('weightChart'),S.weights.map(x=>({v:Number(x.weight),d:x.date})),S.profile.targetWeight,' kg')}function drawLoad(id){const rows=[];S.history.forEach(h=>{const e=(h.exercises||[]).find(x=>x.id===id);if(e){const ds=(e.sets||[]).filter(x=>x.done&&x.load);if(ds.length)rows.push({v:Math.max(...ds.map(x=>Number(x.load))),d:h.end})}});drawLine(document.getElementById('loadChart'),rows,null,' kg')}
function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='antoine-training-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}

function onClick(ev){const b=ev.target.closest('button,[data-nav-direct]');if(!b)return;if(b.dataset.nav){nav(b.dataset.nav);return}if(b.dataset.navDirect){nav(b.dataset.navDirect);return}const a=b.dataset.action;if(!a)return;try{if(a==='settings')settings();else if(a==='start')startWorkout(b.dataset.key);else if(a==='resume-active'){closeSheet();openWorkout()}else if(a==='active-delete')deleteActive();else if(a==='weight-add')addWeight();else if(a==='weight-history')weightHistory();else if(a==='weekly')weekly();else if(a==='exercise'||a==='exercise-info')exerciseSheet(b.dataset.id);else if(a==='settings-save'){S.profile.startWeight=Number(document.getElementById('sStart').value)||105;S.profile.targetWeight=Number(document.getElementById('sTarget').value)||80;S.profile.stepsGoal=Number(document.getElementById('sSteps').value)||8000;S.prefs.autoRest=document.getElementById('sAuto').checked;save();closeSheet();render();toast('Réglages enregistrés')}else if(a==='weight-save'){const v=Number(String(document.getElementById('weightInput').value).replace(',','.'));if(v<40||v>250){alert('Vérifie le poids saisi.');return}S.weights.push({date:new Date().toISOString(),weight:v,source:'Manuel'});save();closeSheet();render();toast('Poids enregistré')}else if(a==='weight-delete'){S.weights.splice(Number(b.dataset.index),1);save();weightHistory();render()}else if(a==='weekly-save'){S.weekly.push({date:new Date().toISOString(),sleep:Number(document.getElementById('wsleep').value),fatigue:Number(document.getElementById('wfat').value),steps:Number(document.getElementById('wsteps').value)||0,cardio:Number(document.getElementById('wcardio').value)||0});save();closeSheet();render();toast('Bilan enregistré')}else if(a==='export')exportData();else if(a==='wo-close'){closeWorkout();toast('Séance sauvegardée')}else if(a==='warmup-start'){S.active.generalWarmup.done=true;S.active.stage='lifting';save();renderWorkout();window.scrollTo(0,0)}else if(a==='wo-prev'){if(S.active.stage==='lifting'&&S.active.index>0){S.active.index--;save();renderWorkout();window.scrollTo(0,0)}}else if(a==='wo-next'||a==='wo-next-top'){nextExercise()}else if(a==='wo-list')workoutList();else if(a==='wo-jump'){S.active.stage='lifting';S.active.index=Number(b.dataset.i);save();closeSheet();renderWorkout()}else if(a==='wo-up'){moveExercise(Number(b.dataset.i),-1)}else if(a==='wo-down'){moveExercise(Number(b.dataset.i),1)}else if(a==='warm-toggle'){const we=S.active.exercises[S.active.index],i=Number(b.dataset.i);we.warmDone[i]=!we.warmDone[i];save();renderWorkout()}else if(a==='set-done'){const we=S.active.exercises[S.active.index],i=Number(b.dataset.i),s=we.sets[i];s.done=!s.done;save();renderWorkout();if(s.done)startRest(E[we.id].rest);else if(restInt)stopRest()}else if(a==='alt')alternatives();else if(a==='alt-choose'){const we=S.active.exercises[S.active.index],id=b.dataset.id,sg=loadSuggestion(id),e=E[id];we.id=id;we.load=sg.load;we.sets=Array.from({length:Math.min(we.sets.length,e.sets)},()=>({load:sg.load||'',reps:'',rir:'',done:false}));we.warmDone=[];save();closeSheet();renderWorkout()}else if(a==='cardio-finish'){S.active.cardio.done=true;finishWorkout()}else if(a==='cardio-skip'){S.active.cardio.minutes=0;S.active.cardio.done=false;finishWorkout()}else if(a==='session-view')sessionView(b.dataset.index);else if(a==='session-edit')sessionEdit(b.dataset.index);else if(a==='session-save-edit')saveSessionEdit(b.dataset.index);else if(a==='session-delete'){const i=Number(b.dataset.index);if(confirm('Supprimer définitivement cette séance de l’historique ?')){S.history.splice(i,1);save();closeSheet();render();toast('Séance supprimée')}}else if(a==='chart-ex'){document.querySelectorAll('#exerciseSelect .seg').forEach(x=>x.classList.remove('active'));b.classList.add('active');drawLoad(b.dataset.id)}else if(a==='rest-add'){if(restInt){restLeft+=30;tick()}}else if(a==='rest-skip')stopRest();else if(a==='session-feel'){const h=S.history[S.history.length-1];if(h)h.feel=b.dataset.feel function onInput(ev){const t=ev.target;if(S.active&&t.dataset.activeField){const f=t.dataset.activeField;if(f==='warmup-minutes')S.active.generalWarmup.minutes=Number(t.value)||0;else if(f==='cardio-minutes')S.active.cardio.minutes=Number(t.value)||0;else if(f==='cardio-rpe')S.active.cardio.rpe=Number(t.value)||3;else if(f==='cardio-type')S.active.cardio.type=t.value;save();return}if(!S.active)return;if(t.dataset.set==null||!t.dataset.field)return;const we=S.active.exercises[S.active.index],i=Number(t.dataset.set);we.sets[i][t.dataset.field]=t.value;if(t.dataset.field==='load'&&i===0){we.load=t.value;for(let j=1;j<we.sets.length;j++)if(!we.sets[j].done)we.sets[j].load=t.value}save()}

function renderSessions(){const draft=S.active?`<div class="card draft-card"><div class="row"><div><b>Séance en cours</b><div class="small muted">${W[S.active.key]?.n||'Entraînement'} · ${S.active.stage==='warmup'?'échauffement':S.active.stage==='cardio'?'cardio':`exercice ${(S.active.index||0)+1}/${S.active.exercises.length}`}</div></div><span>●</span></div><div class="draft-actions"><button class="btn" type="button" data-action="resume-active">Reprendre</button><button class="btn danger" type="button" data-action="active-delete">Supprimer</button></div></div>`:'';document.getElementById('sessions').innerHTML=`<div class="section-head"><h2>Programme</h2><span class="small muted">RIR ${phase().rir}</span></div><div class="program-note"><b>Rotation libre</b><p>A, B et C sont trois vraies séances full body. Tu peux en faire 2 ou 3 selon la semaine : tu reprends simplement là où tu t’étais arrêté.</p></div>${draft}${['A','B','C'].map(k=>sessionCard(k)).join('')}<div class="section-head"><h2>Semaine chargée</h2></div>${['EA','EB'].map(k=>sessionCard(k)).join('')}<div class="card"><b>Règle simple</b><p class="small muted">Les versions Express servent uniquement quand tu manques de temps. Sinon, reste sur les séances complètes.</p></div>`}
function coachTips(){const tips=[];const lastWeight=S.weights[S.weights.length-1];if(!lastWeight||(new Date()-new Date(lastWeight.date))/86400000>=7)tips.push({t:'Poids hebdomadaire à renseigner',d:'Une mesure par semaine, dans des conditions similaires, suffit largement pour suivre la tendance.',e:'Modéré'});tips.push({t:'Progression des charges',d:'Quand toutes tes séries atteignent le haut de la fourchette avec une technique propre et encore 1 à 3 répétitions en réserve, monte la charge à la séance suivante.',e:'Fort'});tips.push({t:'Ordre des exercices',d:'Garde les gros mouvements au début de la séance : squat, développé couché, rowing barre, développé assis. C’est là que tu seras le plus performant.',e:'Fort'});tips.push({t:'Cardio de fin de séance',d:'Conserve 10 à 15 minutes faciles à modérées en fin de séance si tu veux soutenir ta dépense énergétique sans nuire à la musculation.',e:'Fort'});tips.push({t:'Ne complique pas le plan',d:'3 à 4 séries sur les mouvements principaux, 3 séries sur les accessoires, régularité, technique propre et progression simple : c’est déjà largement suffisant.',e:'Fort'});return tips}
function renderCoach(){document.getElementById('coach').innerHTML=`<div class="section-head"><h2>Repères</h2><span class="evidence">pratique</span></div><div class="card" style="background:var(--blue);color:#fff"><div class="row start"><span style="font-size:25px">✦</span><div><b>Programme libre, base solide</b><div class="small" style="opacity:.8">L’objectif est de tourner sur A, B et C, avec une progression simple sur les charges et les répétitions.</div></div></div></div>${coachTips().map((x,i)=>`<div class="card reco ${i===0?'warn':''}"><div class="row"><h3>${x.t}</h3><span class="evidence ${x.e==='Coach'?'coach':''}">${x.e}</span></div><p>${x.d}</p></div>`).join('')}<div class="section-head"><h2>Littérature</h2></div><div class="card sources">${sources.map(s=>`<details><summary>${s[0]}</summary><p>${s[1]}</p><a target="_blank" rel="noopener" href="${s[2]}">Voir la source</a></details>`).join('')}</div>`}
function renderProgress(){const w=latestWeight(),cardio=cardioWeekMinutes(),chartIds=Object.keys(E).filter(id=>E[id].library!==false);document.getElementById('progress').innerHTML=`<div class="section-head"><h2>Progression</h2><button class="text-btn" type="button" data-action="weight-add">+ poids</button></div><div class="dashboard"><div class="metric"><div class="big">${w.toFixed(1)} kg</div><p>poids actuel</p></div><div class="metric"><div class="big">${S.history.length}</div><p>séances enregistrées</p></div><div class="metric"><div class="big">${cardio} min</div><p>cardio cette semaine</p></div><div class="metric"><div class="big">${nextKey()}</div><p>prochaine séance</p></div></div><div class="card" style="margin-top:11px"><div class="row"><div><b>Évolution du poids</b><div class="small muted">Mesure hebdomadaire</div></div><button class="btn alt" type="button" data-action="weight-history">Historique</button></div><canvas id="weightChart" class="chart"></canvas></div><div class="card"><b>Progression des charges</b><div class="selector" id="exerciseSelect">${chartIds.map((id,i)=>`<button class="seg ${i===0?'active':''}" type="button" data-action="chart-ex" data-id="${id}">${E[id].n}</button>`).join('')}</div><canvas id="loadChart" class="chart"></canvas></div><div class="section-head"><h2>Historique des séances</h2></div>${historyHTML()}`;setTimeout(()=>{drawWeight();drawLoad(chartIds[0])},0)}
function settings(){stopRest();showSheet(`<h2>Réglages</h2><div class="card"><label class="field"><span>Poids de départ</span><input id="sStart" type="number" inputmode="decimal" value="${S.profile.startWeight}"></label><label class="field"><span>Poids cible</span><input id="sTarget" type="number" inputmode="decimal" value="${S.profile.targetWeight}"></label><input id="sSteps" type="hidden" value="${S.profile.stepsGoal||0}"><label class="toggle"><span>Chrono de repos automatique</span><input id="sAuto" type="checkbox" ${S.prefs.autoRest?'checked':''}></label></div><div class="sheet-actions"><button class="btn ghost" type="button" data-action="export">Exporter mes données</button><button class="btn" type="button" data-action="settings-save">Enregistrer</button></div><div class="small muted" style="margin-top:8px">Version 5.0</div>`)}
function weekly(){showSheet(`<h2>Cardio hebdomadaire</h2><div class="card"><p class="small muted">Le suivi sommeil, fatigue et nombre de pas a été retiré. Si tu veux garder une trace, note seulement ton cardio réalisé cette semaine.</p><label class="field"><span>Cardio total cette semaine (minutes)</span><input id="wcardio" type="number" inputmode="numeric" value="${cardioWeekMinutes()}"></label><input id="wsleep" type="hidden" value="0"><input id="wfat" type="hidden" value="0"><input id="wsteps" type="hidden" value="0"></div><div class="sheet-actions"><button class="btn" type="button" data-action="weekly-save">Enregistrer</button></div>`)}
function migrate(){S.health={steps:[],lastImport:null};S.history=S.history||[];S.weights=S.weights||[];S.weekly=(S.weekly||[]).map(x=>Object.assign({sleep:0,fatigue:0,steps:0,cardio:0},x));S.history.forEach(h=>{h.generalWarmup=h.generalWarmup||{minutes:null,done:false};h.cardio=h.cardio||{minutes:0,type:'',rpe:null,done:false}});if(S.active){S.active.stage=S.active.stage||'lifting';S.active.generalWarmup=S.active.generalWarmup||{minutes:5,done:false};S.active.cardio=S.active.cardio||{minutes:12,type:'Vélo ou marche inclinée',rpe:3,done:false};S.active.exercises=(S.active.exercises||[]).map(x=>Object.assign({warmDone:[]},x))}S.version='5.0';save()}

document.addEventListener('click',onClick);document.addEventListener('input',onInput);document.addEventListener('change',onInput);document.getElementById('sheetBack').addEventListener('click',e=>{if(e.target.id==='sheetBack')closeSheet()});document.addEventListener('change',async e=>{if(e.target.id==='importFile'&&e.target.files[0]){try{const x=JSON.parse(await e.target.files[0].text());S=Object.assign(clone(defaults),x,{profile:Object.assign({},defaults.profile,x.profile||{}),prefs:Object.assign({},defaults.prefs,x.prefs||{}),health:Object.assign({},defaults.health,x.health||{})});migrate();closeSheet();render();toast('Sauvegarde restaurée')}catch(err){alert('Fichier de sauvegarde invalide.')}}});window.addEventListener('resize',()=>{if(currentScreen==='progress'){drawWeight();const active=document.querySelector('#exerciseSelect .seg.active');drawLoad(active?active.dataset.id:Object.keys(E)[0])}});
migrate();const healthImported=importHealthParams();stopRest();render();if(S.active){openWorkout()}if(healthImported)setTimeout(()=>toast('Données Santé importées ✓'),400);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
