function nextExercise(){const a=S.active;if(a.index<a.exercises.length-1){a.index++;save();renderWorkout();window.scrollTo(0,0)}else finishWorkout()}function finishWorkout(){const a=S.active;a.end=new Date().toISOString();a.exercises.forEach(x=>{x.load=x.sets.find(s=>s.done&&s.load)?.load||x.load});a.completed=a.exercises.reduce((n,x)=>n+x.sets.filter(s=>s.done).length,0);S.history.push(a);S.active=null;save();closeWorkout();celebrate();render();showSheet(`<h2>Séance enregistrée ✓</h2><p class="muted small">${a.completed} séries de travail validées.</p><div class="card"><b>Comment était la séance ?</b><div class="wo-actions"><button class="btn alt" type="button" data-action="session-feel" data-feel="Facile">Facile</button><button class="btn" type="button" data-action="session-feel" data-feel="Bien dosée">Bien dosée</button></div><button class="btn ghost full" style="margin-top:8px" type="button" data-action="session-feel" data-feel="Difficile">Difficile</button></div>`)}
function startRest(sec){if(!S.prefs.autoRest)return;clearInterval(restInt);restLeft=sec;document.getElementById('rest').classList.add('show');tick();restInt=setInterval(()=>{restLeft--;tick();if(restLeft<=0){stopRest();toast('Repos terminé ✓')}},1000)}function tick(){const m=Math.floor(restLeft/60),s=restLeft%60;document.getElementById('restTime').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}function stopRest(){clearInterval(restInt);restInt=null;document.getElementById('rest').classList.remove('show')}
function celebrate(){const d=document.createElement('div');d.className='celebrate';['#F26755','#62C8B1','#F5B844','#BBA7EF'].forEach((c,j)=>{for(let i=0;i<7;i++){const x=document.createElement('i');x.style.left=Math.random()*100+'%';x.style.background=c;x.style.animationDelay=Math.random()*.35+'s';d.appendChild(x)}});document.body.appendChild(d);setTimeout(()=>d.remove(),2100)}
function drawLine(canvas,rows,target,suffix){if(!canvas)return;const r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=r.width*d;canvas.height=210*d;const c=canvas.getContext('2d');c.setTransform(d,0,0,d,0,0);const w=r.width,h=210,p={l:38,r:14,t:20,b:28};c.clearRect(0,0,w,h);if(rows.length<2){c.fillStyle='#718089';c.font='12px -apple-system';c.fillText('Deux mesures minimum pour afficher une courbe.',15,38);return}const vals=rows.map(x=>Number(x.v));let mn=Math.min(...vals),mx=Math.max(...vals),gap=Math.max(1,(mx-mn)*.35);mn-=gap;mx+=gap;const X=i=>p.l+i*((w-p.l-p.r)/(rows.length-1)),Y=v=>p.t+(mx-v)/(mx-mn)*(h-p.t-p.b);c.strokeStyle='#DCE3E5';c.beginPath();c.moveTo(p.l,p.t);c.lineTo(p.l,h-p.b);c.lineTo(w-p.r,h-p.b);c.stroke();c.beginPath();rows.forEach((x,i)=>i?c.lineTo(X(i),Y(x.v)):c.moveTo(X(i),Y(x.v)));c.strokeStyle='#0A4B6C';c.lineWidth=3;c.stroke();rows.forEach((x,i)=>{c.beginPath();c.arc(X(i),Y(x.v),4,0,Math.PI*2);c.fillStyle='#F26755';c.fill()});c.fillStyle='#718089';c.font='10px -apple-system';c.fillText(`${mx.toFixed(0)}${suffix||''}`,3,p.t+3);c.fillText(`${mn.toFixed(0)}${suffix||''}`,3,h-p.b);if(target!=null){c.fillStyle='#F26755';const t=`objectif ${target}${suffix||''}`;c.fillText(t,w-p.r-c.measureText(t).width,p.t+2)}}function drawWeight(){drawLine(document.getElementById('weightChart'),S.weights.map(x=>({v:Number(x.weight),d:x.date})),S.profile.targetWeight,' kg')}function drawLoad(id){const rows=[];S.history.forEach(h=>{const e=(h.exercises||[]).find(x=>x.id===id);if(e){const ds=(e.sets||[]).filter(x=>x.done&&x.load);if(ds.length)rows.push({v:Math.max(...ds.map(x=>Number(x.load))),d:h.end})}});drawLine(document.getElementById('loadChart'),rows,null,' kg')}
function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='antoine-training-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function onClick(ev){const b=ev.target.closest('button,[data-nav-direct]');if(!b)return;if(b.dataset.nav){nav(b.dataset.nav);return}if(b.dataset.navDirect){nav(b.dataset.navDirect);return}const a=b.dataset.action;if(!a)return;try{if(a==='settings')settings();else if(a==='start')startWorkout(b.dataset.key);else if(a==='weight-add')addWeight();else if(a==='weight-history')weightHistory();else if(a==='weekly')weekly();else if(a==='exercise'||a==='exercise-info')exerciseSheet(b.dataset.id);else if(a==='settings-save'){S.profile.startWeight=Number(document.getElementById('sStart').value)||105;S.profile.targetWeight=Number(document.getElementById('sTarget').value)||80;S.profile.stepsGoal=Number(document.getElementById('sSteps').value)||8000;S.prefs.autoRest=document.getElementById('sAuto').checked;save();closeSheet();render();toast('Réglages enregistrés')}else if(a==='weight-save'){const v=Number(String(document.getElementById('weightInput').value).replace(',','.'));if(v<40||v>250){alert('Vérifie le poids saisi.');return}S.weights.push({date:new Date().toISOString(),weight:v});save();closeSheet();render();toast('Poids enregistré')}else if(a==='weight-delete'){S.weights.splice(Number(b.dataset.index),1);save();weightHistory();render()}else if(a==='weekly-save'){S.weekly.push({date:new Date().toISOString(),sleep:Number(document.getElementById('wsleep').value),fatigue:Number(document.getElementById('wfat').value),steps:Number(document.getElementById('wsteps').value)||0,cardio:Number(document.getElementById('wcardio').value)||0});save();closeSheet();render();toast('Bilan enregistré')}else if(a==='export')exportData();else if(a==='wo-close'){closeWorkout();toast('Séance sauvegardée')}else if(a==='wo-prev'){if(S.active.index>0){S.active.index--;save();renderWorkout();window.scrollTo(0,0)}}else if(a==='wo-next')nextExercise();else if(a==='wo-list')workoutList();else if(a==='wo-jump'){S.active.index=Number(b.dataset.i);save();closeSheet();renderWorkout()}else if(a==='warm-toggle'){const we=S.active.exercises[S.active.index],i=Number(b.dataset.i);we.warmDone[i]=!we.warmDone[i];save();renderWorkout()}else if(a==='set-done'){const we=S.active.exercises[S.active.index],i=Number(b.dataset.i),s=we.sets[i];s.done=!s.done;save();renderWorkout();if(s.done)startRest(E[we.id].rest)}else if(a==='alt')alternatives();else if(a==='alt-choose'){const we=S.active.exercises[S.active.index],id=b.dataset.id,sg=loadSuggestion(id),e=E[id];we.id=id;we.load=sg.load;we.sets=Array.from({length:Math.min(we.sets.length,e.sets)},()=>({load:sg.load||'',reps:'',rir:'',done:false}));we.warmDone=[];save();closeSheet();renderWorkout()}else if(a==='chart-ex'){document.querySelectorAll('#exerciseSelect .seg').forEach(x=>x.classList.remove('active'));b.classList.add('active');drawLoad(b.dataset.id)}else if(a==='rest-add'){restLeft+=30;tick()}else if(a==='rest-skip')stopRest();else if(a==='session-feel'){const h=S.history[S.history.length-1];if(h)h.feel=b.dataset.feel;save();closeSheet();toast('Ressenti enregistré')}}catch(err){console.error(err);toast('Une erreur est survenue')}}
function onInput(ev){if(!S.active)return;const t=ev.target;if(t.dataset.set==null||!t.dataset.field)return;const we=S.active.exercises[S.active.index],i=Number(t.dataset.set);we.sets[i][t.dataset.field]=t.value;if(t.dataset.field==='load'&&i===0){we.load=t.value;for(let j=1;j<we.sets.length;j++)if(!we.sets[j].done)we.sets[j].load=t.value}save()}
document.addEventListener('click',onClick);document.addEventListener('input',onInput);document.getElementById('sheetBack').addEventListener('click',e=>{if(e.target.id==='sheetBack')closeSheet()});document.addEventListener('change',async e=>{if(e.target.id==='importFile'&&e.target.files[0]){try{const x=JSON.parse(await e.target.files[0].text());S=Object.assign(clone(defaults),x);save();closeSheet();render();toast('Sauvegarde restaurée')}catch(err){alert('Fichier de sauvegarde invalide.')}}});window.addEventListener('resize',()=>{if(currentScreen==='progress'){drawWeight();const active=document.querySelector('#exerciseSelect .seg.active');drawLoad(active?active.dataset.id:Object.keys(E)[0])}});
render();if(S.active){document.getElementById('workout').classList.add('show');document.body.style.overflow='hidden';renderWorkout()}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
