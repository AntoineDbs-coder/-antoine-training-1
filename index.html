function clone(o){return JSON.parse(JSON.stringify(o))}function load(){try{const x=JSON.parse(localStorage.getItem('antoineTrainingV3'));return Object.assign(clone(defaults),x||{},{profile:Object.assign({},defaults.profile,x&&x.profile||{}),prefs:Object.assign({},defaults.prefs,x&&x.prefs||{})})}catch(e){return clone(defaults)}}function save(){try{localStorage.setItem('antoineTrainingV3',JSON.stringify(S))}catch(e){}}
function phase(){return{key:'free',label:'Rotation libre A → B → C',target:0,rir:'1–3',keys:['A','B','C']}}
function weekStart(d){const x=new Date(d||new Date());x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}function thisWeek(){const s=weekStart();return S.history.filter(h=>new Date(h.end||h.start)>=s)}function nextKey(){const list=['A','B','C'],done=S.history.filter(h=>list.includes(h.key));if(!done.length)return'A';const last=done[done.length-1].key;return list[(list.indexOf(last)+1)%list.length]}
function latestWeight(){return S.weights.length?Number(S.weights[S.weights.length-1].weight):S.profile.startWeight}function fmtDate(v,opt){return new Intl.DateTimeFormat('fr-FR',opt||{day:'numeric',month:'short'}).format(new Date(v))}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function lastExercise(id){for(let i=S.history.length-1;i>=0;i--){const e=(S.history[i].exercises||[]).find(x=>x.id===id);if(e)return e}return null}function loadSuggestion(id){const e=E[id],last=lastExercise(id);if(!last)return{load:'',label:'Calibrer la charge'};const ds=(last.sets||[]).filter(x=>x.done);if(!ds.length)return{load:last.load||'',label:'Reprendre la dernière charge'};if(e.unit==='sec')return{load:'',label:'Garder une tenue propre'};const load=Number(ds[0].load||last.load||0),reps=ds.map(x=>Number(x.reps||0)),rirs=ds.map(x=>Number(x.rir||99));if(reps.every(r=>r>=e.max)&&rirs.every(r=>r>=1))return{load:load+e.inc,label:'Augmentation proposée'};if(reps.filter(r=>r<e.min).length>=2||rirs.filter(r=>r===0).length>=2)return{load:Math.max(0,load-e.inc),label:'Réduction proposée'};return{load:load,label:'Même charge proposée'}}
function warm(id,load){const e=E[id];if(!e.warm||e.unit==='sec')return[];const patterns=e.warm===3?[[.4,10,'Très léger'],[.6,6,'Léger'],[.8,3,'Proche de la charge de travail']]:e.warm===2?[[.55,7,'Léger'],[.78,3,'Proche de la charge de travail']]:[[.55,6,'Léger']];const L=Number(load||0),round=x=>Math.max(0,Math.round(x/2.5)*2.5);return patterns.map(([p,r,label])=>({l:L?round(L*p):null,r,label}))}
function warmText(x){return x.l!=null?`${x.l} kg × ${x.r}`:`${x.label} × ${x.r}`}
function latestSteps(){if(S.health&&S.health.steps&&S.health.steps.length)return Number(S.health.steps[S.health.steps.length-1].steps);const w=S.weekly[S.weekly.length-1];return w&&w.steps?Number(w.steps):null}
function durationMin(h){if(!h||!h.start||!h.end)return null;return Math.max(1,Math.round((new Date(h.end)-new Date(h.start))/60000))}

function migrate(){S.health=S.health||{steps:[],lastImport:null};S.health.steps=S.health.steps||[];S.history=S.history||[];S.weights=S.weights||[];S.weekly=S.weekly||[];S.history.forEach(h=>{h.generalWarmup=h.generalWarmup||{minutes:null,done:false};h.cardio=h.cardio||{minutes:0,type:'',rpe:null,done:false}});if(S.active){S.active.stage=S.active.stage||'lifting';S.active.generalWarmup=S.active.generalWarmup||{minutes:5,done:false};S.active.cardio=S.active.cardio||{minutes:10,type:'Vélo ou marche inclinée',rpe:3,done:false};S.active.exercises=(S.active.exercises||[]).map(x=>Object.assign({warmDone:[]},x))}S.version='5.1';save()}
function importHealthParams(){const q=new URLSearchParams(location.search),wRaw=q.get('healthWeight'),sRaw=q.get('healthSteps'),source=q.get('healthSource')||'Apple Santé';let changed=false;const date=new Date().toISOString();if(wRaw!=null){const w=Number(String(wRaw).replace(',','.'));if(w>=40&&w<=250){const last=S.weights[S.weights.length-1];if(!last||Math.abs(Number(last.weight)-w)>.01||(new Date()-new Date(last.date))>3600000){S.weights.push({date,weight:w,source});changed=true}}}if(sRaw!=null){const steps=Math.round(Number(sRaw));if(steps>=0&&steps<100000){S.health.steps.push({date,steps,source});S.health.steps=S.health.steps.slice(-120);changed=true}}if(changed){S.health.lastImport={date,source};save()}if(wRaw!=null||sRaw!=null){history.replaceState(null,'',location.pathname+location.hash)}return changed}

function sessionCard(k,home){const w=W[k],img=E[w.ex[0]].img;return `<article class="card session-card"><div class="session-cover"><img src="${img}" alt=""><span class="session-badge">${w.express?'~30 min':'~60–70 min + cardio optionnel'}</span></div><div class="session-body"><div class="row"><div><h3>${w.n}</h3><div class="small muted">${w.ex.length} exercices · RIR ${phase().rir}</div></div><button class="btn" type="button" data-action="start" data-key="${k}">Go</button></div><div class="tags">${w.ex.slice(0,4).map(id=>`<span class="tag">${E[id].n}</span>`).join('')}${w.ex.length>4?`<span class="tag">+${w.ex.length-4}</span>`:''}</div></div></article>`}

function recoveryLabel(x){if(x.sleep<=4||x.fatigue>=8)return'Basse';if(x.sleep<=6||x.fatigue>=6)return'Moyenne';return'Bonne'}function coachTips(){const out=[],lastWeight=S.weights[S.weights.length-1];if(!lastWeight||(new Date()-new Date(lastWeight.date))/86400000>=7)out.push({t:'Poids hebdomadaire à renseigner',d:'Une mesure par semaine, dans des conditions similaires, suffit pour suivre la tendance.',e:'Modéré'});out.push({t:'Progression simple',d:'Quand toutes tes séries atteignent le haut de la fourchette avec une technique propre et encore 1 à 3 répétitions en réserve, augmente légèrement la charge.',e:'Fort'});out.push({t:'Gros mouvements en premier',d:'Squat, développé couché, rowing barre et développé assis restent placés tôt dans la séance pour profiter de ta meilleure disponibilité.',e:'Fort'});out.push({t:'Cardio en fin de séance',d:'10 à 15 minutes faciles à modérées après la musculation restent un bon complément si tu veux les faire.',e:'Fort'});return out}

function historyHTML(){if(!S.history.length)return'<div class="card muted small">Aucune séance terminée pour l’instant.</div>';return [...S.history].map((h,i)=>({h,i})).reverse().slice(0,20).map(({h,i})=>{const dur=durationMin(h),cardio=Number(h.cardio?.minutes||0);return `<button class="history-card" type="button" data-action="session-view" data-index="${i}"><div class="history-top"><div><div class="history-name">${W[h.key]?.n||h.key||'Séance'}</div><div class="history-meta">${fmtDate(h.end||h.start,{weekday:'short',day:'numeric',month:'short'})}${dur?` · ${dur} min`:''}</div></div><span>›</span></div><div class="history-badges"><span>${h.completed||0} séries</span>${h.feel?`<span>${h.feel}</span>`:''}${cardio?`<span>cardio ${cardio} min</span>`:''}</div></button>`}).join('')}
function renderProgress(){const w=latestWeight(),wk=thisWeek(),cardio=wk.reduce((n,h)=>n+Number(h.cardio?.minutes||0),0),ids=Object.keys(E).filter(id=>E[id].library!==false);document.getElementById('progress').innerHTML=`<div class="section-head"><h2>Progression</h2><button class="text-btn" type="button" data-action="weight-add">+ poids</button></div><div class="dashboard"><div class="metric"><div class="big">${w.toFixed(1)} kg</div><p>poids actuel</p></div><div class="metric"><div class="big">${S.history.length}</div><p>séances enregistrées</p></div><div class="metric"><div class="big">${cardio} min</div><p>cardio cette semaine</p></div><div class="metric"><div class="big">${nextKey()}</div><p>prochaine séance</p></div></div><div class="card" style="margin-top:11px"><div class="row"><div><b>Évolution du poids</b><div class="small muted">Mesure hebdomadaire</div></div><button class="btn alt" type="button" data-action="weight-history">Historique</button></div><canvas id="weightChart" class="chart"></canvas></div><div class="card"><b>Progression des charges</b><div class="selector" id="exerciseSelect">${ids.map((id,i)=>`<button class="seg ${i===0?'active':''}" type="button" data-action="chart-ex" data-id="${id}">${E[id].n}</button>`).join('')}</div><canvas id="loadChart" class="chart"></canvas></div><div class="section-head"><h2>Historique des séances</h2></div>${historyHTML()}`;setTimeout(()=>{drawWeight();if(ids[0])drawLoad(ids[0])},0)}

function showSheet(html){document.getElementById('rest').classList.remove('show');document.getElementById('sheet').innerHTML=`<div class="handle"></div>${html}`;document.getElementById('sheetBack').classList.add('show')}function closeSheet(){document.getElementById('sheetBack').classList.remove('show');if(restInt&&S.active&&S.active.stage==='lifting'&&document.getElementById('workout').classList.contains('show'))document.getElementById('rest').classList.add('show')}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1700)}

function startWorkout(key){if(S.active){showSheet(`<h2>Une séance est déjà en cours</h2><p class="small muted">Reprends-la ou supprime-la avant d’en démarrer une autre.</p><button class="btn full" type="button" data-action="resume-active">Reprendre ${W[S.active.key]?.n||'la séance'}</button><button class="btn danger full" style="margin-top:8px" type="button" data-action="active-delete">Supprimer la séance en cours</button>`);return}const w=W[key];S.active={key,start:new Date().toISOString(),stage:'warmup',index:0,targetRIR:phase().rir,generalWarmup:{minutes:w.express?4:5,done:false},cardio:{minutes:w.express?5:10,type:'Vélo ou marche inclinée',rpe:3,done:false},exercises:w.ex.map(id=>{const sg=loadSuggestion(id),e=E[id],n=w.express?Math.min(2,e.sets):e.sets;return{id,original:id,load:sg.load,sets:Array.from({length:n},()=>({load:sg.load||'',reps:'',rir:'',done:false})),warmDone:[]}})};save();openWorkout()}

function renderCardioStage(){const a=S.active;stopRest();const c=a.cardio;document.getElementById('workout').innerHTML=`${workoutHeader(W[a.key].n,'Fin de séance · cardio',96)}<div class="wo-main"><article class="stage-card"><div class="stage-visual"><span class="stage-icon">♥︎</span></div><div class="stage-body"><div class="kicker">Option recommandée</div><h1>Cardio de fin de séance</h1><p class="small muted">Reste facile à modéré : tu dois pouvoir parler en phrases. Ce bloc construit progressivement ta condition sans transformer la séance de musculation en séance d’endurance.</p><div class="form-grid"><div class="field"><label>Durée (min)</label><input type="number" min="0" max="60" data-active-field="cardio-minutes" value="${Number(c.minutes||0)}"></div><div class="field"><label>Effort /10</label><input type="number" min="1" max="7" data-active-field="cardio-rpe" value="${Number(c.rpe||3)}"></div></div><div class="field" style="margin-top:10px"><label>Modalité</label><select data-active-field="cardio-type"><option ${c.type==='Vélo ou marche inclinée'?'selected':''}>Vélo ou marche inclinée</option><option ${c.type==='Vélo'?'selected':''}>Vélo</option><option ${c.type==='Marche inclinée'?'selected':''}>Marche inclinée</option><option ${c.type==='Elliptique'?'selected':''}>Elliptique</option><option ${c.type==='Rameur'?'selected':''}>Rameur</option></select></div><button class="btn full" style="margin-top:14px" type="button" data-action="cardio-finish">Terminer et enregistrer ✓</button><button class="btn ghost full" style="margin-top:8px" type="button" data-action="cardio-skip">Pas de cardio aujourd’hui</button></div></article></div>`}
function renderWorkout(){const a=S.active;if(!a)return;if(a.stage==='warmup'){renderWarmupStage();return}if(a.stage==='cardio'){renderCardioStage();return}const k=a.index,we=a.exercises[k],e=E[we.id],last=lastExercise(we.id),sg=loadSuggestion(we.id),wu=warm(we.id,we.sets[0].load||we.load),pct=5+((k+1)/a.exercises.length)*88;const topNav=`<div class="wo-step-nav"><button type="button" data-action="wo-prev" ${k===0?'disabled':''}>‹</button><span>${e.n}</span><button type="button" data-action="wo-next-top" ${k===a.exercises.length-1?'disabled':''}>›</button></div>`;document.getElementById('workout').innerHTML=`${workoutHeader(W[a.key].n,`Exercice ${k+1}/${a.exercises.length}`,pct,topNav)}<div class="wo-main"><article class="exercise-hero"><img src="${e.img}" alt="${esc(e.n)}"><div class="exercise-info"><div class="row"><div><h1>${e.n}</h1><div class="muscles"><strong>${e.p}</strong> · ${e.s}<br>${we.sets.length} × ${e.min}–${e.max}${e.side?' / côté':''} · RIR ${a.targetRIR}</div></div></div><div class="hint"><b>À faire</b><span>${e.cues[0]} ${e.cues[1]}</span></div>${last?`<div class="last-perf"><b>Dernière fois</b><p>${perfText(last)} · <strong>${sg.label}${sg.load!==''?' : '+sg.load+' kg':''}</strong></p></div>`:`<div class="last-perf"><b>Charge à calibrer</b><p>Choisis une charge adaptée à la fourchette de répétitions et termine autour de ${a.targetRIR} RIR.</p></div>`}<div class="warm-box"><div class="warm-title"><b class="small">Échauffement spécifique</b><span class="warm-count ${e.warm?'':'warm-zero'}">${e.warm||0} série${e.warm===1?'':'s'}</span></div>${e.warm?`${wu.map((x,i)=>`<div class="warm-row"><span class="small">${warmText(x)}</span><button class="mini-check ${we.warmDone[i]?'done':''}" type="button" data-action="warm-toggle" data-i="${i}">${we.warmDone[i]?'✓':'○'}</button></div>`).join('')} ${!Number(we.sets[0].load||we.load)?'<div class="tiny muted" style="margin-top:5px">Les charges seront précisées dès que ta charge de travail est connue.</div>':''}` function perfText(last){const ds=(last.sets||[]).filter(x=>x.done);if(!ds.length)return'Données incomplètes';if(E[last.id]&&E[last.id].unit==='sec')return ds.map(x=>x.reps+' s').join(' / ');return `${ds[0].load||last.load||'—'} kg · ${ds.map(x=>x.reps||'—').join('/')}`}

function sessionView(i){const h=S.history[Number(i)];if(!h)return;const dur=durationMin(h);showSheet(`<h2>${W[h.key]?.n||'Séance'}</h2><p class="small muted">${fmtDate(h.end||h.start,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}${dur?` · ${dur} min`:''}</p><div class="card"><div class="row"><div><b>Échauffement général</b><div class="small muted">${h.generalWarmup?.minutes||'—'} min</div></div><div><b>Cardio</b><div class="small muted">${h.cardio?.minutes||0} min</div></div></div>${h.feel?`<div class="tag" style="margin-top:10px">Ressenti : ${h.feel}</div>`:''}</div><div class="card">${(h.exercises||[]).map(x=>`<div class="history-ex"><img src="${E[x.id]?.img||''}" alt=""><div><b>${E[x.id]?.n||x.id}</b><p>${perfText(x)} · échauffement ${(E[x.id]?.warm||0)} série${E[x.id]?.warm===1?'':'s'}</p></div></div>`).join('')}</div><div class="wo-actions"><button class="btn" type="button" data-action="session-edit" data-index="${i}">Modifier</button><button class="btn danger" type="button" data-action="session-delete" data-index="${i}">Supprimer</button></div>`)}
function toLocalInput(v){const d=new Date(v||Date.now()),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}
function sessionEdit(i){const h=S.history[Number(i)];if(!h)return;showSheet(`<h2>Modifier la séance</h2><div class="form-grid"><div class="field"><label>Date / heure</label><input id="histDate" type="datetime-local" value="${toLocalInput(h.end||h.start)}"></div><div class="field"><label>Ressenti</label><select id="histFeel"><option value="">—</option>${['Facile','Bien dosée','Difficile'].map(x=>`<option ${h.feel===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Échauffement général (min)</label><input id="histWarm" type="number" min="0" max="30" value="${h.generalWarmup?.minutes||0}"></div><div class="field"><label>Cardio (min)</label><input id="histCardio" type="number" min="0" max="120" value="${h.cardio?.minutes||0}"></div></div><div style="margin-top:12px">${(h.exercises||[]).map((x,ei)=>`<div class="edit-ex"><h4>${E[x.id]?.n||x.id}</h4><div class="setlabels"><span></span><span>kg</span><span>rép.</span><span>RIR</span><span>✓</span></div>${(x.sets||[]).map((s,si)=>`<div class="edit-set"><b>${si+1}</b><input data-he="${ei}" data-hs="${si}" data-hf="load" value="${s.load||''}"><input data-he="${ei}" data-hs="${si}" data-hf="reps" value="${s.reps||''}"><input data-he="${ei}" data-hs="${si}" data-hf="rir" value="${s.rir||''}"><input type="checkbox" data-he="${ei}" data-hs="${si}" data-hf="done" ${s.done?'checked':''}></div>`).join('')}</div>`).join('')}</div><button class="btn full" type="button" data-action="session-save-edit" data-index="${i}">Enregistrer les modifications</button>`)}
function saveSessionEdit(i){const h=S.history[Number(i)];if(!h)return;const dt=document.getElementById('histDate').value;if(dt){const oldStart=new Date(h.start||h.end),oldEnd=new Date(h.end||h.start),duration=Math.max(0,oldEnd-oldStart),newEnd=new Date(dt);h.end=newEnd.toISOString();h.start=new Date(newEnd-duration).toISOString()}h.feel=document.getElementById('histFeel').value;h.generalWarmup=h.generalWarmup||{};h.generalWarmup.minutes=Number(document.getElementById('histWarm').value)||0;h.cardio=h.cardio||{};h.cardio.minutes=Number(document.getElementById('histCardio').value)||0;document.querySelectorAll('[data-he]').forEach(el=>{const e=Number(el.dataset.he),s=Number(el.dataset.hs),f=el.dataset.hf;if(h.exercises[e]&&h.exercises[e].sets[s])h.exercises[e].sets[s][f]=f==='done'?el.checked:el.value});h.completed=h.exercises.reduce((n,x)=>n+x.sets.filter(s=>s.done).length,0);save();closeSheet();render();toast('Séance modifiée')}
function startRest(sec){if(!S.prefs.autoRest||!S.active||S.active.stage!=='lifting')return;clearInterval(restInt);restLeft=sec;const el=document.getElementById('rest');el.classList.remove('show');tick();requestAnimationFrame(()=>el.classList.add('show'));restInt=setInterval(()=>{restLeft--;tick();if(restLeft<=0){stopRest();toast('Repos terminé ✓')}},1000)}function tick(){const m=Math.floor(Math.max(0,restLeft)/60),s=Math.max(0,restLeft)%60;document.getElementById('restTime').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}function stopRest(){clearInterval(restInt);restInt=null;restLeft=0;const el=document.getElementById('rest');if(el)el.classList.remove('show')}
function celebrate(){const d=document.createElement('div');d.className='celebrate';['#F26755','#62C8B1','#F5B844','#BBA7EF'].forEach((c,j)=>{for(let i=0;i<7;i++){const x=document.createElement('i');x.style.left=Math.random()*100+'%';x.style.background=c;x.style.animationDelay=Math.random()*.35+'s';d.appendChild(x)}});document.body.appendChild(d);setTimeout(()=>d.remove(),2100)}
function drawLine(canvas,rows,target,suffix){if(!canvas)return;const r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=r.width*d;canvas.height=210*d;const c=canvas.getContext('2d');c.setTransform(d,0,0,d,0,0);const w=r.width,h=210,p={l:38,r:14,t:20,b:28};c.clearRect(0,0,w,h);if(rows.length<2){c.fillStyle='#718089';c.font='12px -apple-system';c.fillText('Deux mesures minimum pour afficher une courbe.',15,38);return}const vals=rows.map(x=>Number(x.v));let mn=Math.min(...vals),mx=Math.max(...vals),gap=Math.max(1,(mx-mn)*.35);mn-=gap;mx+=gap;const X=i=>p.l+i*((w-p.l-p.r)/(rows.length-1)),Y=v=>p.t+(mx-v)/(mx-mn)*(h-p.t-p.b);c.strokeStyle='#DCE3E5';c.beginPath();c.moveTo(p.l,p.t);c.lineTo(p.l,h-p.b);c.lineTo(w-p.r,h-p.b);c.stroke();c.beginPath();rows.forEach((x,i)=>i?c.lineTo(X(i),Y(x.v)):c.moveTo(X(i),Y(x.v)));c.strokeStyle='#0A4B6C';c.lineWidth=3;c.stroke();rows.forEach((x,i)=>{c.beginPath();c.arc(X(i),Y(x.v),4,0,Math.PI*2);c.fillStyle='#F26755';c.fill()});c.fillStyle='#718089';c.font='10px -apple-system';c.fillText(`${mx.toFixed(0)}${suffix||''}`,3,p.t+3);c.fillText(`${mn.toFixed(0)}${suffix||''}`,3,h-p.b);if(target!=null){c.fillStyle='#F26755';const t=`objectif ${target}${suffix||''}`;c.fillText(t,w-p.r-c.measureText(t).width,p.t+2)}}function drawWeight(){drawLine(document.getElementById('weightChart'),S.weights.map(x=>({v:Number(x.weight),d:x.date})),S.profile.targetWeight,' kg')}function drawLoad(id){const rows=[];S.history.forEach(h=>{const e=(h.exercises||[]).find(x=>x.id===id);if(e){const ds=(e.sets||[]).filter(x=>x.done&&x.load);if(ds.length)rows.push({v:Math.max(...ds.map(x=>Number(x.load))),d:h.end})}});drawLine(document.getElementById('loadChart'),rows,null,' kg')}
function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='antoine-training-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function deleteActive(){if(!S.active)return;if(!confirm('Supprimer définitivement cette séance en cours ?'))return;S.active=null;save();stopRest();closeSheet();closeWorkout();render();toast('Séance supprimée')}
function onClick(ev){const b=ev.target.closest('button,[data-nav-direct]');if(!b)return;if(b.dataset.nav){nav(b.dataset.nav);return}if(b.dataset.navDirect){nav(b.dataset.navDirect);return}const a=b.dataset.action;if(!a)return;try{if(a==='settings')settings();else if(a==='start')startWorkout(b.dataset.key);else if(a==='resume-active'){closeSheet();openWorkout()}else if(a==='active-delete')deleteActive();else if(a==='weight-add')addWeight();else if(a==='weight-history')weightHistory();else if(a==='exercise'||a==='exercise-info')exerciseSheet(b.dataset.id);else if(a==='settings-save'){S.profile.startWeight=Number(document.getElementById('sStart').value)||105;S.profile.targetWeight=Number(document.getElementById('sTarget').value)||80;S.prefs.autoRest=document.getElementById('sAuto').checked;save();closeSheet();render();toast('Réglages enregistrés')}else if(a==='weight-save'){const v=Number(String(document.getElementById('weightInput').value).replace(',','.'));if(v<40||v>250){alert('Vérifie le poids saisi.');return}S.weights.push({date:new Date().toISOString(),weight:v,source:'Manuel'});save();closeSheet();render();toast('Poids enregistré')}else if(a==='weight-delete'){S.weights.splice(Number(b.dataset.index),1);save();weightHistory();render()}else if(a==='export')exportData();else if(a==='wo-close'){closeWorkout();toast('Séance sauvegardée')}else if(a==='warmup-start'){S.active.generalWarmup.done=true;S.active.stage='lifting';save();renderWorkout();window.scrollTo(0,0)}else if(a==='wo-prev'){if(S.active.stage==='lifting'&&S.active.index>0){S.active.index--;save();renderWorkout();window.scrollTo(0,0)}}else if(a==='wo-next'||a==='wo-next-top'){nextExercise()}else if(a==='wo-list')workoutList();else if(a==='wo-jump'){S.active.stage='lifting';S.active.index=Number(b.dataset.i);save();closeSheet();renderWorkout()}else if(a==='warm-toggle'){const we=S.active.exercises[S.active.index],i=Number(b.dataset.i);we.warmDone[i]=!we.warmDone[i];save();renderWorkout()}else if(a==='set-done'){const we=S.active.exercises[S.active.index],i=Number(b.dataset.i),s=we.sets[i];s.done=!s.done;save();renderWorkout();if(s.done)startRest(E[we.id].rest);else if(restInt)stopRest()}else if(a==='alt')alternatives();else if(a==='alt-choose'){const we=S.active.exercises[S.active.index],id=b.dataset.id,sg=loadSuggestion(id),e=E[id];we.id=id;we.load=sg.load;we.sets=Array.from({length:Math.min(we.sets.length,e.sets)},()=>({load:sg.load||'',reps:'',rir:'',done:false}));we.warmDone=[];save();closeSheet();renderWorkout()}else if(a==='cardio-finish'){S.active.cardio.done=true;finishWorkout()}else if(a==='cardio-skip'){S.active.cardio.minutes=0;S.active.cardio.done=false;finishWorkout()}else if(a==='session-view')sessionView(b.dataset.index);else if(a==='session-edit')sessionEdit(b.dataset.index);else if(a==='session-save-edit')saveSessionEdit(b.dataset.index);else if(a==='session-delete'){const i=Number(b.dataset.index);if(confirm('Supprimer définitivement cette séance de l’historique ?')){S.history.splice(i,1);save();closeSheet();render();toast('Séance supprimée')}}else if(a==='chart-ex'){document.querySelectorAll('#exerciseSelect .seg').forEach(x=>x.classList.remove('active'));b.classList.add('active');drawLoad(b.dataset.id)}else if(a==='rest-add'){if(restInt){restLeft+=30;tick()}}else if(a==='rest-skip')stopRest();else if(a==='session-feel'){const h=S.history[S.history.length-1];if(h)h.feel=b.dataset.feel;save();closeSheet();render();toast('Ressenti enregistré')}}catch(err){console.error(err);toast('Une erreur est survenue')}}
function onInput(ev){const t=ev.target;if(S.active&&t.dataset.activeField){const f=t.dataset.activeField;if(f==='warmup-minutes')S.active.generalWarmup.minutes=Number(t.value)||0;else if(f==='cardio-minutes')S.active.cardio.minutes=Number(t.value)||0;else if(f==='cardio-rpe')S.active.cardio.rpe=Number(t.value)||3;else if(f==='cardio-type')S.active.cardio.type=t.value;save();return}if(!S.active)return;if(t.dataset.set==null||!t.dataset.field)return;const we=S.active.exercises[S.active.index],i=Number(t.dataset.set);we.sets[i][t.dataset.field]=t.value;if(t.dataset.field==='load'&&i===0){we.load=t.value;for(let j=1;j<we.sets.length;j++)if(!we.sets[j].done)we.sets[j].load=t.value}save()}
document.addEventListener('click',onClick);document.addEventListener('input',onInput);document.addEventListener('change',onInput);document.getElementById('sheetBack').addEventListener('click',e=>{if(e.target.id==='sheetBack')closeSheet()});document.addEventListener('change',async e=>{if(e.target.id==='importFile'&&e.target.files[0]){try{const x=JSON.parse(await e.target.files[0].text());S=Object.assign(clone(defaults),x,{profile:Object.assign({},defaults.profile,x.profile||{}),prefs:Object.assign({},defaults.prefs,x.prefs||{}),health:Object.assign({},defaults.health,x.health||{})});migrate();closeSheet();render();toast('Sauvegarde restaurée')}catch(err){alert('Fichier de sauvegarde invalide.')}}});window.addEventListener('resize',()=>{if(currentScreen==='progress'){drawWeight();const active=document.querySelector('#exerciseSelect .seg.active');drawLoad(active?active.dataset.id:Object.keys(E)[0])}});
migrate();stopRest();render();if(S.active){openWorkout()}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
